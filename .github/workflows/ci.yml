name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: find . -maxdepth 1 -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run tests
        run: node --test tests/*.test.js
